x-app-image: &app-image
  image: navia-api:${APP_IMAGE_TAG:-1.4.0}
  build:
    context: ./api

x-app-security: &app-security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - navia_internal

x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *app-logging
    networks:
      - navia_internal

  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Configure PGADMIN_DEFAULT_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configure PGADMIN_DEFAULT_PASSWORD en .env}
      PGADMIN_CONFIG_SESSION_DB_PATH: "'/tmp/pgadmin_sessions'"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5027}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    security_opt:
      - no-new-privileges:true
    logging: *app-logging
    networks:
      - navia_internal

  uploads-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    network_mode: "none"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /uploads
        mkdir -p /private_uploads
        chown -R 10001:10001 /uploads
        chown -R 10001:10001 /private_uploads
        chmod -R u+rwX,g+rwX,o-rwx /uploads
        chmod -R u+rwX,g+rwX,o-rwx /private_uploads
    volumes:
      - ./data/uploads:/uploads
      - ./data/ai_uploads:/private_uploads
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  schema-init:
    <<: [*app-image, *app-security]
    restart: "no"
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ["python", "-m", "schema_upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *app-logging

  api:
    <<: [*app-image, *app-security]
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8002}:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/ai_uploads:/app/private_uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      schema-init:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s
    logging: *app-logging

  notification-worker:
    <<: [*app-image, *app-security]
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ["python", "-m", "module_worker"]
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "worker_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 45s
    logging: *app-logging

volumes:
  pgadmin_data:

networks:
  navia_internal:
    driver: bridge
